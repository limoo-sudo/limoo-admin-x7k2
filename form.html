<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>limoo カウンセリングシート</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F1EC;--fg:#4A433C;--mute:#9C9188;--line:#E3DDD4;--card:#FFFFFF;--acc:#8C7F72;--accfg:#FFFFFF;--sel:#9FC3DA;--selfg:#FFFFFF;--red:#b3402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1C19;--fg:#EDE7DF;--mute:#A39A90;--line:#3A342E;--card:#2A2622;--acc:#CDBFAE;--accfg:#1F1C19;--sel:#7FA9C4;--selfg:#1F1C19;--red:#e0806f}}
:root[data-theme="dark"]{--bg:#1F1C19;--fg:#EDE7DF;--mute:#A39A90;--line:#3A342E;--card:#2A2622;--acc:#CDBFAE;--accfg:#1F1C19;--sel:#7FA9C4;--selfg:#1F1C19;--red:#e0806f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:300;letter-spacing:.03em;line-height:1.6}
#app{max-width:560px;margin:0 auto;padding:20px 18px 60px}
header{text-align:center;padding:14px 0 6px}
.logo{font-family:Futura,'Jost','Century Gothic',sans-serif;font-size:30px;font-weight:500;letter-spacing:.02em;line-height:1;display:inline-block}.logo::after{content:'eye / brow';display:block;font-weight:300;font-size:.38em;letter-spacing:.2em;margin-top:6px;text-align:center}
h1{font-weight:300;font-size:19px;text-align:center;margin:18px 0 6px}.intro{color:var(--mute);font-size:13px;text-align:center;margin:0 0 8px;line-height:1.8}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.sec h2{font-weight:400;font-size:15px;margin:0 0 4px;letter-spacing:.08em}.sec h2 small{color:var(--mute);font-size:11px}
label.l{display:block;font-size:12px;color:var(--mute);margin:14px 0 6px}.req{color:var(--red);font-size:10px;margin-left:6px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:var(--bg);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.cp{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:16px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}.cp.on{background:var(--sel);border-color:var(--sel);color:var(--selfg)}
.wt{margin-top:8px}
.note{font-size:12px;color:var(--mute);margin:8px 0 0;white-space:pre-line;line-height:1.8}
.para p{font-size:13px;line-height:1.85;margin:6px 0}
.ag{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.7;cursor:pointer}.ag:first-of-type{border-top:0}.ag input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:#9FC3DA}
.gr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.gr:first-child{border-top:0}.gr span{flex:none;width:90px;font-size:13px}
.para h3{font-size:13px;font-weight:500;margin:16px 0 4px}.para .scr{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:8px;padding:0 2px 10px}
.sigbox{background:#fff;border:1px dashed var(--mute);border-radius:12px;height:120px;display:flex;align-items:center;justify-content:center;color:#9C9188;font-size:14px;cursor:pointer;overflow:hidden}.sigbox img{max-width:100%;max-height:100%}
.sigm{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sigm p{text-align:center;font-size:14px;margin:4px 0 10px}.sigm canvas{flex:1;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;touch-action:none;display:block}
.sigm .bt{display:flex;gap:8px;margin-top:12px}.sigm .bt button{flex:1;min-height:52px;border-radius:26px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:15px;cursor:pointer}.sigm .bt .pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn{width:100%;min-height:54px;border:0;border-radius:30px;background:var(--acc);color:var(--accfg);font:inherit;font-size:15px;letter-spacing:.15em;cursor:pointer;margin-top:18px}.btn:disabled{opacity:.4}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:6px 14px;font:inherit;font-size:12px;cursor:pointer}
.err{color:var(--red);font-size:12px;margin-top:6px}.bad{outline:2px solid var(--red);outline-offset:4px;border-radius:12px}
.ctr{text-align:center;padding:18vh 10px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="forms.js"></script></head><body><div id="app"></div><div id="sigm"></div>
<script>
const SB=(window.supabase&&typeof SUPABASE_URL!=='undefined'&&SUPABASE_URL&&!SUPABASE_URL.startsWith('YOUR'))?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let A={},S={v:'load',tpl:null,bad:{},sig:null},TOKEN=new URLSearchParams(location.search).get('t');
const $=id=>document.getElementById(id);
function show(h){$('app').innerHTML=`<header><div class="logo">limoo</div></header>`+h}
async function init(){
 if(!SB||!TOKEN){show('<p class="ctr" style="color:var(--mute)">QRコードを読み取り直してください。</p>');return}
 const{data,error}=await SB.rpc('form_open',{p_token:TOKEN});
 if(error||!data){show('<h1>このQRコードは使えません</h1><p class="intro">有効期限が切れているか、すでに記入済みです。<br>お手数ですが、スタッフにお声がけください。</p>');return}
 S.tpl=FORMS.find(f=>f.id===data.template);if(!S.tpl){show('<p class="ctr">フォームが見つかりません。</p>');return}
 A.name=data.name||'';A.kana=data.kana||'';A.tel=data.tel||'';S.v='form';render()}
const has=(k,o)=>(A[k]||[]).includes(o);
function tog(k,o,m){if(m){const a=A[k]||[];A[k]=a.includes(o)?a.filter(x=>x!==o):[...a,o];if(['特になし','該当なし','使用していない'].includes(o)&&A[k].includes(o))A[k]=[o];else if(A[k].length>1)A[k]=A[k].filter(x=>!['特になし','該当なし','使用していない'].includes(x))}else A[k]=A[k]===o?'':o;delete S.bad[k];render()}
function fld(f){const R=f.req?'<span class="req">必須</span>':'',id=`f-${f.k||''}`;
 if(f.type==='note')return `<p class="note">${esc(f.x)}</p>`;
 if(['text','tel','date','time'].includes(f.type))return `<div id="${id}" class="${S.bad[f.k]?'bad':''}"><label class="l">${esc(f.l)}${R}</label><input type="${f.type}" ${f.type==='tel'?'inputmode="tel"':''} value="${esc(A[f.k]||'')}" placeholder="${esc(f.ph||'')}" oninput="A['${f.k}']=this.value"></div>`;
 if(f.type==='textarea')return `<label class="l">${esc(f.l)}</label><textarea rows="3" placeholder="${esc(f.ph||'')}" oninput="A['${f.k}']=this.value">${esc(A[f.k]||'')}</textarea>`;
 if(f.type==='one'||f.type==='multi'){const m=f.type==='multi';
  return `<div id="${id}" class="${S.bad[f.k]?'bad':''}">${f.l?`<label class="l">${esc(f.l)}${R}</label>`:''}<div class="chips">${f.o.map((o,i)=>`<button class="cp ${(m?has(f.k,o):A[f.k]===o)?'on':''}" onclick="tog('${f.k}',FORMS_O('${f.k}',${i}),${m?1:0})">${esc(o)}</button>`).join('')}</div>${(f.wt||[]).filter(o=>m?has(f.k,o):A[f.k]===o).map(o=>`<input class="wt" placeholder="${o==='ご紹介'?'ご紹介者のお名前':'具体的にご記入ください'}" value="${esc(A[f.k+'__'+o]||'')}" oninput="A['${f.k}__${o}']=this.value">`).join('')}</div>`}
 if(f.type==='grid')return `${f.rows.map(([r,os],i)=>`<div class="gr"><span>${esc(r)}</span><div class="chips">${os.map(o=>`<button class="cp ${A[f.k+'.'+i]===o?'on':''}" onclick="A['${f.k}.${i}']=A['${f.k}.${i}']==='${o}'?'':'${o}';render()">${esc(o)}</button>`).join('')}</div></div>`).join('')}`;
 if(f.type==='agree')return `<div id="${id}" class="${S.bad[f.k]?'bad':''}">${f.items.map((x,i)=>`<label class="ag"><input type="checkbox" ${has(f.k,i)?'checked':''} onchange="tog('${f.k}',${i},1)"><span>${esc(x)}</span></label>`).join('')}</div>`;
 return ''}
const OPT={};function FORMS_O(k,i){return OPT[k][i]}
function render(){const t=S.tpl;if(S.v!=='form')return;
 t.sections.forEach(s=>(s.f||[]).forEach(f=>{if(f.o)OPT[f.k]=f.o}));
 const y=scrollY;
 let h=`<h1>${esc(t.title)}</h1>${t.intro?`<p class="intro">${esc(t.intro)}</p>`:''}`;
 let no=0;t.sections.forEach((s,i)=>{const num=t.kind==='counsel'&&i>0&&!s.sub&&s.t!=='同意事項'?`<small>${++no}　</small>`:'';h+=`<div class="sec ${s.p||s.sub?'para':''}"><h2>${num}${esc(s.t)}</h2>${s.p?s.p.map(x=>`<p>${esc(x)}</p>`).join(''):''}${s.sub?`<p class="note">最後までお読みください</p><div class="scr">${s.sub.map(x=>`<h3>■ ${esc(x.t)}</h3>`+x.p.map(y=>`<p>${esc(y)}</p>`).join('')).join('')}</div>`:''}${(s.f||[]).map(fld).join('')}</div>`});
 h+=`<div class="sec" id="f-sig"><h2>ご署名</h2><p class="note">${esc(t.final||'')}</p><div class="sigbox ${S.bad.sig?'bad':''}" onclick="sigOpen()">${S.sig?`<img src="${S.sig}" alt="署名">`:'タップして署名する'}</div>${S.sig?'<div style="text-align:right;margin-top:8px"><button class="chip" onclick="sigOpen()">書き直す</button></div>':''}</div>`;
 h+=`<div id="er" class="err"></div><button class="btn" id="sb" onclick="submitF()">送信する</button>`;
 show(h);scrollTo(0,y)}
function sigOpen(){const M=$('sigm');document.body.style.overflow='hidden';
 M.innerHTML=`<div class="sigm"><p>枠の中に、指でお名前をお書きください</p><canvas id="sig"></canvas><div class="bt"><button onclick="sigClear()">書き直す</button><button onclick="sigClose()">やめる</button><button class="pri" onclick="sigDone()">決定</button></div></div>`;
 const c=$('sig'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height);
 x.lineWidth=3;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#2b2b2b';S.drawn=false;
 let d=false,pts=[];const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 const seg=()=>{if(pts.length<3){const[a,b]=[pts[0],pts[pts.length-1]];x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0]+.1,b[1]+.1);x.stroke();return}const n=pts.length,a=pts[n-3],b=pts[n-2],e=pts[n-1];x.beginPath();x.moveTo((a[0]+b[0])/2,(a[1]+b[1])/2);x.quadraticCurveTo(b[0],b[1],(b[0]+e[0])/2,(b[1]+e[1])/2);x.stroke()};
 c.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});c.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
 c.onpointerdown=e=>{d=true;pts=[p(e)];S.drawn=true;c.setPointerCapture(e.pointerId);seg()};
 c.onpointermove=e=>{if(!d)return;(e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{pts.push(p(ev));seg()})};
 c.onpointerup=c.onpointercancel=()=>{d=false;pts=[]};S.sx=x;S.sc=c;S.sr=r}
function sigClear(){const x=S.sx,r=S.sr;x.fillStyle='#fff';x.fillRect(0,0,r.width,r.height);S.drawn=false}
function sigClose(){$('sigm').innerHTML='';document.body.style.overflow=''}
function sigDone(){if(!S.drawn){alert('枠の中にお名前をお書きください');return}const c=S.sc,o=document.createElement('canvas'),w=900,hh=Math.round(w*c.height/c.width);o.width=w;o.height=hh;o.getContext('2d').drawImage(c,0,0,w,hh);S.sig=o.toDataURL('image/jpeg',.8);delete S.bad.sig;sigClose();render()}
function check(){const t=S.tpl,bad={};
 t.sections.forEach(s=>(s.f||[]).forEach(f=>{if(f.type==='agree'){if((A[f.k]||[]).length<f.items.length)bad[f.k]='すべての項目にチェックしてください'}
  else if(f.req){const v=A[f.k];if(!v||(Array.isArray(v)&&!v.length)||(typeof v==='string'&&!v.trim()))bad[f.k]=`「${f.l||s.t}」を入力してください`}}));
 if(!S.sig)bad.sig='ご署名をお願いします';return bad}
async function submitF(){S.bad=check();if(Object.keys(S.bad).length){render();const k=Object.keys(S.bad)[0];$('er').textContent=S.bad[k];const el=$(k==='sig'?'f-sig':'f-'+k);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return}
 const b=$('sb');b.disabled=true;b.textContent='送信中…';
 const{error}=await SB.rpc('form_submit',{p_token:TOKEN,p_answers:A,p_sign:S.sig});
 if(error){b.disabled=false;b.textContent='送信する';$('er').textContent=/expired|used/.test(error.message||'')?'このQRコードの有効期限が切れました。スタッフにお声がけください。':'送信できませんでした。もう一度お試しください。';return}
 S.v='done';show(`<div class="ctr"><div style="font-size:34px;font-weight:200">✓</div><h1>ご記入ありがとうございました</h1><p class="intro">内容を確認のうえ、施術させていただきます。<br>この画面は閉じて大丈夫です。</p></div>`)}
init();
</script></body></html>
