<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>limoo 管理</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#faf8f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="limoo管理">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#faf8f3;--fg:#2b2b2b;--mute:#8a867d;--line:#e6e1d6;--card:#fff;--acc:#2b2b2b;--accfg:#fff;--red:#b3402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--fg:#eee9df;--mute:#9b968b;--line:#35332f;--card:#262522;--acc:#eee9df;--accfg:#1c1b19;--red:#e0806f}}
:root[data-theme="dark"]{--bg:#1c1b19;--fg:#eee9df;--mute:#9b968b;--line:#35332f;--card:#262522;--acc:#eee9df;--accfg:#1c1b19;--red:#e0806f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:300;letter-spacing:.04em;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:14px 18px 170px}
.top{display:flex;justify-content:space-between;align-items:baseline}.logo{font-size:22px;letter-spacing:.3em;font-weight:200}.mute{color:var(--mute);font-size:12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:16px 0 6px}.nav b{font-weight:300;font-size:18px}
.ib{width:44px;height:44px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--fg);font-size:18px;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:6px 14px;font:inherit;font-size:12px;cursor:pointer}
.bk{display:flex;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:14px 16px;margin:0 0 10px;font:inherit;cursor:pointer}
.bk .t{width:52px;flex:none;font-size:15px}.bk.x{opacity:.4}.bk.x .n{text-decoration:line-through}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.grp{font-size:12px;color:var(--mute);margin:22px 0 8px;letter-spacing:.12em}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar>div{max-width:560px;margin:0 auto;padding:10px 18px 0}
.tabs{display:flex;margin-top:6px}.tabs button{flex:1;min-height:48px;border:0;background:none;color:var(--mute);font:inherit;font-size:13px;letter-spacing:.15em;cursor:pointer}.tabs button.on{color:var(--fg);border-top:2px solid var(--fg)}
.btn{width:100%;min-height:50px;border:0;border-radius:28px;background:var(--acc);color:var(--accfg);font:inherit;font-size:14px;letter-spacing:.15em;cursor:pointer}
.btn.o{background:none;color:var(--fg);border:1px solid var(--line)}.btn.d{background:none;color:var(--red);border:1px solid var(--red)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 12px;font-weight:300;font-size:18px}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:var(--card);color:var(--fg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sp{height:10px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.kv span:first-child{color:var(--mute)}
.err{color:var(--red);font-size:12px;margin-top:8px}
.it{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:13px 16px;margin-bottom:8px;font:inherit;font-size:14px;cursor:pointer}
.tl{position:relative;margin:6px 0 10px;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}.hl span{position:absolute;left:8px;top:2px;font-size:11px;color:var(--mute)}.hl.h2{left:52px;border-top:1px dotted var(--line)}.hl.h3{left:52px;border-top:1px dotted var(--line);opacity:.4}
.off{position:absolute;left:52px;right:0;background:var(--line);opacity:.5}
.blk{position:absolute;left:54px;right:4px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg);padding:5px 10px;text-align:left;font:inherit;font-size:12px;line-height:1.35;overflow:hidden;cursor:pointer}
.blk div{opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;left:46px;right:0;border-top:2px solid var(--red);z-index:2;pointer-events:none}
.lg{max-width:340px;margin:14vh auto 0;text-align:center}.lg form{text-align:left}.lg .logo{font-size:30px;margin-bottom:6px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-top:14px}.seg button{flex:1;min-height:38px;border:0;border-radius:10px;background:none;color:var(--mute);font:inherit;font-size:14px;cursor:pointer}.seg button.on{background:var(--card);color:var(--fg)}
.closedl{position:absolute;left:52px;right:0;top:40%;text-align:center;color:var(--mute);font-size:14px;letter-spacing:.3em}
.wkh{display:grid;grid-template-columns:30px repeat(7,1fr);margin-bottom:4px}.wkh button{border:0;background:none;color:var(--fg);font:inherit;font-size:15px;line-height:1.2;padding:6px 0;border-radius:10px;cursor:pointer}.wkh small{font-size:10px;color:var(--mute)}.wkh .td{background:var(--acc);color:var(--accfg)}.wkh .td small{color:inherit}.wkh .cl{opacity:.4}
.wkb{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}.wkb .hl span{left:6px;font-size:10px}
.woff{position:absolute;background:var(--line);opacity:.5}
.wev{position:absolute;box-sizing:border-box;background:var(--acc);color:var(--accfg);border:1px solid var(--card);border-radius:5px;font-size:10px;line-height:1.2;padding:2px;overflow:hidden;cursor:pointer}
.wev.pb{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px);border-color:var(--line)}
.mon{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mon .wd{text-align:center;font-size:11px;color:var(--mute);padding:4px 0}
.mc{min-height:62px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px;font:inherit;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.mc b{font-weight:300;font-size:13px}.mc .n{align-self:flex-end;background:var(--acc);color:var(--accfg);border-radius:10px;font-size:11px;padding:0 6px}
.mc.o{opacity:.35}.mc.cl{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}.mc.td{border-color:var(--fg)}
.hr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.hr select{width:auto;flex:1}
.note2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}.note2 .hr{border:0;padding:0}
.blk.pb{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);color:var(--fg);border:1px solid var(--line)}
.blk.pb div,.blk.pb b{opacity:1}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script src="config.js"></script></head><body><div id="app"></div><div id="sheet"></div>
<script>
/* ===== データ：Supabase（bookings / customers / menu_items）。メモリ上の D に読み込んで描画 ===== */
const CFG={open:540,close:1200}; // 営業時間の最小〜最大（設定から自動計算）
const sv=()=>{};
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)};
const TODAY=dstr(new Date());
let D={cat:[],opts:[],bk:[],cu:{},pb:[],set:{hours:{0:{open:'09:00',close:'20:00'},1:{open:'09:00',close:'20:00'},2:{open:'09:00',close:'20:00'},3:{open:'09:00',close:'20:00'},4:{open:'09:00',close:'20:00'},5:{open:'09:00',close:'20:00'},6:{open:'09:00',close:'20:00'}},closedW:[3],closedD:new Set(),closedList:[]}};
const toM=t=>{const[a,b]=String(t).split(':');return +a*60+ +b};
function dayH(s){const d=new Date(s+'T00:00:00').getDay(),st=D.set;if(st.closedW.includes(d)||st.closedD.has(s))return null;const h=st.hours[d];return h?{o:toM(h.open),c:toM(h.close)}:null}let STAFF=null;
D.cu=D.cu||{};
let S={tab:'bk',date:TODAY,sheet:null};
const WD='日月火水木金土';
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const yen=n=>'¥'+Number(n).toLocaleString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const dayB=()=>D.bk.filter(b=>b.date===S.date).sort((a,b)=>a.start-b.start);

/* ===== DB（Supabase）読み込み：画面は従来どおり D（予約・メニュー・オプション）を描画する ===== */
async function loadAll(){
 if(!STAFF){const r=await SB.from('staff').select('id').eq('active',true).order('name').limit(1);STAFF=r.data&&r.data[0]?r.data[0].id:null}
 const[b,m,t,st,cd]=await Promise.all([
  SB.from('bookings').select('id,customer_id,item,price,memo,start_at,end_at,status,customers(name,tel,memo,hidden)').order('start_at').limit(5000),
  SB.from('menu_items').select('id,kind,grp,name,price,minutes,sort,active,description').order('sort'),
  SB.from('time_blocks').select('id,start_at,end_at,title').order('start_at'),
  SB.from('salon_settings').select('hours,closed_weekdays,opt_map').eq('id',1).single(),
  SB.from('closed_dates').select('date,note').order('date')]);
 if(b.error||m.error||t.error||st.error||cd.error){alert('データを読み込めませんでした。通信状況を確認してください。');return false}
 D.bk=b.data.map(r=>{const t=new Date(new Date(r.start_at).getTime()+9*3600e3);return{id:r.id,cid:r.customer_id,date:t.toISOString().slice(0,10),start:t.getUTCHours()*60+t.getUTCMinutes(),min:(new Date(r.end_at)-new Date(r.start_at))/60000,name:r.customers.name,tel:r.customers.tel||'',item:r.item,price:r.price,memo:r.memo||'',status:r.status==='confirmed'?'ok':'x',hid:!!r.customers.hidden}});
 const J=x=>new Date(new Date(x).getTime()+9*3600e3);
 D.pb=t.data.map(r=>{const a=J(r.start_at),e=J(r.end_at);return{id:r.id,date:a.toISOString().slice(0,10),start:a.getUTCHours()*60+a.getUTCMinutes(),end:e.getUTCHours()*60+e.getUTCMinutes(),title:r.title}});
 D.set={hours:st.data.hours,closedW:st.data.closed_weekdays||[],closedD:new Set(cd.data.map(r=>r.date)),closedList:cd.data,optMap:st.data.opt_map||{}};
 {const hs=Object.values(D.set.hours);CFG.open=Math.min(...hs.map(h=>toM(h.open)));CFG.close=Math.max(...hs.map(h=>toM(h.close)));H0=Math.min(480,Math.floor(CFG.open/60)*60);H1=Math.max(1260,Math.ceil(CFG.close/60)*60)}
 D.cu={};b.data.forEach(r=>{if(r.customers.memo)D.cu[ck({name:r.customers.name,tel:r.customers.tel||''})]=r.customers.memo});
 const mk=kind=>{const gs=[],ix={};m.data.filter(x=>x.kind===kind).forEach(x=>{let g=ix[x.grp];if(!g){g=ix[x.grp]={n:x.grp,items:[],all:[]};gs.push(g)}g.all.push(x.id);if(x.active)g.items.push([x.name,x.price,x.minutes,x.id,x.description||''])});return gs};
 D.cat=mk('menu');D.opts=mk('option');return true}
async function refresh(){await loadAll();render()}
async function dbSaveBk(id,r,vi){
 const start=new Date(`${r.date}T${fmt(r.start)}:00+09:00`),end=new Date(start.getTime()+r.min*60000),old=id?D.bk.find(b=>b.id===id):null;
 const grp=vi?D.cat[vi.split(':')[0]].n:null;let cid=old?old.cid:null;
 if(!cid||old.name!==r.name||old.tel!==r.tel){ // 同じ名前＋電話のお客様は再利用、なければ新規
  const q=await SB.from('customers').select('id').eq('name',r.name).eq('tel',r.tel).limit(1);if(q.error)throw q.error;
  if(q.data.length)cid=q.data[0].id;else{const c=await SB.from('customers').insert({name:r.name,tel:r.tel}).select('id').single();if(c.error)throw c.error;cid=c.data.id}}
 const row={customer_id:cid,item:r.item,price:r.price,memo:r.memo,start_at:start.toISOString(),end_at:end.toISOString()};
 if(grp)row.menu=grp;
 const res=id?await SB.from('bookings').update(row).eq('id',id):await SB.from('bookings').insert({...row,staff_id:STAFF,menu:grp||r.item,options:[]});
 if(res.error)throw res.error}
/* ===== ログイン（Supabase Auth：メール＋パスワード。管理者テーブルに登録された人だけ入れる） ===== */
const SB=(window.supabase&&typeof SUPABASE_URL!=='undefined'&&SUPABASE_URL&&!SUPABASE_URL.startsWith('YOUR'))?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let AUTH={user:null,admin:false,ready:false,err:'',email:''};
async function isAdmin(){try{const{data,error}=await SB.rpc('is_admin');return !error&&data===true}catch(e){return false}}
async function boot(){
 if(!SB){render();return}
 const{data}=await SB.auth.getSession();AUTH.user=data.session?data.session.user:null;AUTH.admin=AUTH.user?await isAdmin():false;
 if(AUTH.user&&!AUTH.admin){await SB.auth.signOut();AUTH.user=null;AUTH.err='このアカウントには管理画面の権限がありません'}
 AUTH.ready=true;if(AUTH.user)await loadAll();render();
 if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AUTH.user&&AUTH.admin&&!S.sheet)refresh()});
 SB.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&AUTH.user){AUTH.user=null;AUTH.admin=false;render()}});
}
async function login(e){e.preventDefault();const em=document.getElementById('le').value.trim(),pw=document.getElementById('lp').value;AUTH.email=em;AUTH.err='';
 const b=document.getElementById('lb');b.disabled=true;b.textContent='確認中…';
 const{data,error}=await SB.auth.signInWithPassword({email:em,password:pw});
 if(error){AUTH.err='メールアドレスまたはパスワードが正しくありません';render();return}
 AUTH.user=data.user;AUTH.admin=await isAdmin();
 if(!AUTH.admin){await SB.auth.signOut();AUTH.user=null;AUTH.err='このアカウントには管理画面の権限がありません'}
 if(AUTH.admin)await loadAll();render()}
async function logout(){await SB.auth.signOut();AUTH.user=null;AUTH.admin=false;AUTH.err='';S.sheet=null;render()}
const loginHtml=()=>`<div class="lg"><div class="logo">limoo</div><p class="mute" style="margin:0 0 28px">管理画面</p><form onsubmit="login(event)"><label>メールアドレス</label><input id="le" type="email" inputmode="email" autocomplete="username" autocapitalize="off" value="${esc(AUTH.email||'')}" required><label>パスワード</label><input id="lp" type="password" autocomplete="current-password" required>${AUTH.err?`<div class="err">${AUTH.err}</div>`:''}<div class="sp"></div><button class="btn" id="lb" type="submit">ログイン</button></form></div>`;
function render(){
 const A=$('app'),E=$('sheet');
 if(!SB){E.innerHTML='';A.innerHTML=`<div class="lg"><div class="logo">limoo</div><p class="mute">管理画面</p><p style="font-size:13px;line-height:1.8;margin-top:24px">ログインの設定がまだ完了していません。<br>config.js に Supabase のURLとキーを入れてください。</p></div>`;return}
 if(!AUTH.ready){E.innerHTML='';A.innerHTML=`<p class="mute" style="text-align:center;padding:30vh 0 0">読み込み中…</p>`;return}
 if(!AUTH.user||!AUTH.admin){E.innerHTML='';A.innerHTML=loginHtml();return}
 renderApp()}
function renderApp(){
 const A=$('app');let h=`<div class="top"><span class="logo">limoo</span><button class="chip" onclick="logout()">ログアウト</button></div>`;
 if(S.tab==='bk'){h+=bkView();
 }else if(S.tab==='st'){h+=setView()
 }else if(S.tab==='cu'){
  h+=`<h3 style="font-weight:300;margin:18px 0 8px">お客様</h3><input id="q" type="search" placeholder="名前・電話番号で検索" value="${esc(S.q||'')}" oninput="S.q=this.value;cuList()" style="margin-bottom:12px"><div id="cl"></div>`;
 }else{
  h+=`<div class="row" style="margin:18px 0 4px"><h3 style="font-weight:300;margin:0">メニュー・価格・施術時間</h3><button class="chip" onclick="S.sort=!S.sort;render()">${S.sort?'完了':'並び替え'}</button></div><p class="mute">${S.sort?'▲▼で順番を入れ替えます（お客様の予約画面にも反映されます）':'項目をタップして編集できます'}</p>`;
  const ar=(up,dn,u,d)=>`<span style="display:flex;gap:6px;flex:none"><button class="ib" ${u?'disabled style="opacity:.25"':''} onclick="${up}">▲</button><button class="ib" ${d?'disabled style="opacity:.25"':''} onclick="${dn}">▼</button></span>`;
  const sec=(k,list)=>list.map((g,gi)=>S.sort
   ?`<div class="grp" style="display:flex;justify-content:space-between;align-items:center"><span>${esc(g.n)}</span>${ar(`mvG('${k}',${gi},-1)`,`mvG('${k}',${gi},1)`,gi===0,gi===list.length-1)}</div>`+g.items.map((it,i)=>`<div class="it" style="align-items:center"><span style="flex:1;min-width:0">${esc(it[0])}<div class="mute">${yen(it[1])} ／ ${it[2]}分</div></span>${ar(`mvI('${k}',${gi},${i},-1)`,`mvI('${k}',${gi},${i},1)`,i===0,i===g.items.length-1)}</div>`).join('')
   :`<div class="grp" style="display:flex;justify-content:space-between;align-items:center"><span>${esc(g.n)}</span><button class="chip" onclick="op({t:'gr',k:'${k}',g:${gi}})">編集</button></div>`+g.items.map((it,i)=>`<button class="it" onclick="op({t:'it',k:'${k}',g:${gi},i:${i}})"><span style="flex:1;min-width:0">${esc(it[0])}${it[4]?`<div class="mute" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it[4])}</div>`:''}</span><span class="mute" style="white-space:nowrap;text-align:right">${yen(it[1])}<br>${it[2]}分</span></button>`).join('')+`<button class="chip" onclick="op({t:'it',k:'${k}',g:${gi},i:-1})">＋ 項目を追加</button>`).join('');
  h+=sec('cat',D.cat)+`<h3 style="font-weight:300;margin:34px 0 0">オプション</h3>`+sec('opts',D.opts);
 }
 A.innerHTML=h+`<div class="bar"><div>${S.tab==='bk'?`<div style="display:flex;gap:10px"><button class="btn" onclick="op({t:'f'})">＋ 予約</button><button class="btn o" onclick="op({t:'pf'})">＋ 予定</button></div>`:''}<div class="tabs"><button class="${S.tab==='bk'?'on':''}" onclick="S.tab='bk';render()">予約</button><button class="${S.tab==='cu'?'on':''}" onclick="S.tab='cu';render()">お客様</button><button class="${S.tab==='mn'?'on':''}" onclick="S.tab='mn';render()">メニュー</button><button class="${S.tab==='st'?'on':''}" onclick="S.tab='st';render()">設定</button></div></div></div>`;
 sheet();if(S.tab==='cu')cuList();
}
let H0=480,H1=1260;const PH=88,WPH=40;
function tl(L){
 const y=m=>(m-H0)/60*PH;let g='';
 for(let m=H0;m<H1;m+=60)g+=`<div class="hl" style="top:${y(m)}px"><span>${fmt(m)}</span></div><div class="hl h2" style="top:${y(m+30)}px"></div><div class="hl h3" style="top:${y(m+15)}px"></div><div class="hl h3" style="top:${y(m+45)}px"></div>`;
 const hh=dayH(S.date),off=hh?`<div class="off" style="top:0;height:${y(hh.o)}px"></div><div class="off" style="top:${y(hh.c)}px;height:${y(H1)-y(hh.c)}px"></div>`:`<div class="off" style="top:0;height:${y(H1)}px"></div><div class="closedl">休業日</div>`;

function pickIt(){const v=$('fi').value;if(!v)return;const[g,i]=v.split(':'),x=D.cat[g].items[i];$('fm').value=x[2];$('fp').value=x[1]}
async function saveOrder(k){const r=await SB.rpc('reorder_menu',{p_ids:D[k].flatMap(g=>g.all)});if(r.error){alert('並び順を保存できませんでした');await refresh()}}
async function mvI(k,gi,i,d){const g=D[k][gi],A=g.all.indexOf(g.items[i][3]),B=g.all.indexOf(g.items[i+d][3]);[g.all[A],g.all[B]]=[g.all[B],g.all[A]];[g.items[i],g.items[i+d]]=[g.items[i+d],g.items[i]];render();await saveOrder(k)}
async function mvG(k,gi,d){const L=D[k];[L[gi],L[gi+d]]=[L[gi+d],L[gi]];render();await saveOrder(k)}
function allDay(){const hh=dayH($('pd').value)||{o:CFG.open,c:CFG.close};$('ps').value=hh.o;$('pe').value=hh.c}
async function savePb(id){const v=k=>$(k).value.trim(),title=v('pt'),date=v('pd'),st=+v('ps'),en=+v('pe'),er=m=>{$('fe').textContent=m};
 if(!title)return er('予定の内容を入力してください');if(!date)return er('日付を入力してください');if(!(en>st))return er('終了は開始より後にしてください');
 if(D.bk.some(b=>b.date===date&&b.status==='ok'&&st<b.start+b.min&&en>b.start))return er('この時間には予約が入っています。先に予約を変更またはキャンセルしてください');
 const row={title,start_at:new Date(`${date}T${fmt(st)}:00+09:00`).toISOString(),end_at:new Date(`${date}T${fmt(en)}:00+09:00`).toISOString()};
 const r=id?await SB.from('time_blocks').update(row).eq('id',id):await SB.from('time_blocks').insert({...row,staff_id:STAFF});
 if(r.error)return er('保存できませんでした');await refresh();S.date=date;cl()}
async function delPb(id){if(!confirm('この予定を削除しますか？'))return;const r=await SB.from('time_blocks').delete().eq('id',id);if(r.error){alert('削除できませんでした');return}await refresh();cl()}
async function saveF(id){
 const v=k=>$(k).value.trim(),name=v('fn'),vi=v('fi'),date=v('fd'),st=+v('fs'),min=+v('fm'),price=+v('fp'),er=m=>{$('fe').textContent=m};
 if(!name)return er('お名前を入力してください');
 if(!vi&&!id)return er('メニューを選択してください');
 if(!date||!(min>0))return er('日付と施術時間を確認してください');
 {const hh=dayH(date);if((!hh||st<hh.o||st+min>hh.c)&&!confirm(hh?'営業時間外ですが、予約を入れますか？':'休業日ですが、予約を入れますか？'))return}
 if(D.bk.some(b=>b.id!==id&&b.date===date&&b.status==='ok'&&st<b.start+b.min&&st+min>b.start))return er('その時間は他の予約と重なっています');
 if(D.pb.some(x=>x.date===date&&st<x.end&&st+min>x.start))return er('その時間は予定（休憩など）が入っています');
 const item=vi?(x=>D.cat[x[0]].items[x[1]][0])(vi.split(':')):D.bk.find(b=>b.id===id).item;
 const rec={date,start:st,min,name,tel:v('ft'),item,price,memo:v('fo')};
 try{await dbSaveBk(id,rec,vi)}catch(e){return er(e.code==='23P01'?'その時間は他の予約と重なっています':'保存できませんでした：'+(e.message||e))}
 await refresh();S.date=date;cl();
}
async function cancelB(id){const r=await SB.from('bookings').update({status:'canceled'}).eq('id',id);if(r.error){alert('キャンセルできませんでした');return}await refresh();cl()}
async function saveI(){const s=S.sheet,n=$('en').value.trim(),p=+$('ep').value,m=+$('em').value;
 if(!n||isNaN(p)||isNaN(m)||$('ep').value===''||$('em').value==='')return $('fe').textContent='名称・料金・時間を入力してください';
 const g=D[s.k][s.g],r=s.i>=0?await SB.from('menu_items').update({name:n,price:p,minutes:m,description:$('ed').value.trim()||null}).eq('id',g.items[s.i][3]):await SB.from('menu_items').insert({kind:s.k==='cat'?'menu':'option',grp:g.n,name:n,price:p,minutes:m,sort:Math.floor(Date.now()/1000),description:$('ed').value.trim()||null});
 if(r.error)return $('fe').textContent='保存できませんでした';await refresh();cl()}
async function delI(){const s=S.sheet,r=await SB.from('menu_items').update({active:false}).eq('id',D[s.k][s.g].items[s.i][3]);if(r.error){alert('削除できませんでした');return}await refresh();cl()}
